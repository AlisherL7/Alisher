<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Космос ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; touch-action: none; }

        #hint {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
            animation: fadeHint 5s ease-in-out forwards;
        }

        #counter {
            position: fixed;
            top: 24px;
            right: 24px;
            color: rgba(255,255,255,0.25);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
        }

        @keyframes fadeHint {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            70%  { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">Тапни по экрану ✨</div>
<div id="counter">0 взрывов</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const hint   = document.getElementById('hint');
const counter = document.getElementById('counter');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
let blastCount = 0;

/* ── Palette ─────────────────────────────────────────────── */
const palettes = [
    ['#ff6b6b','#feca57','#ff9ff3','#fff','#ff6b9d'],
    ['#48dbfb','#1dd1a1','#0abde3','#fff','#54a0ff'],
    ['#a29bfe','#fd79a8','#e84393','#fff','#6c5ce7'],
    ['#ffeaa7','#fdcb6e','#e17055','#fff','#fab1a0'],
    ['#00cec9','#00b894','#55efc4','#fff','#81ecec'],
    ['#fd79a8','#a29bfe','#6c5ce7','#fff','#fdcb6e'],
];
let paletteIdx = 0;

/* ── Stars ────────────────────────────────────────────────── */
const stars = Array.from({ length: 220 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.4 + 0.2,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.025 + 0.008,
}));

/* ── Particles & Shockwaves ───────────────────────────────── */
const particles  = [];
const shockwaves = [];

function createExplosion(x, y) {
    const pal = palettes[paletteIdx % palettes.length];
    paletteIdx++;
    blastCount++;
    counter.textContent = blastCount + (blastCount === 1 ? ' взрыв' :
        blastCount < 5 ? ' взрыва' : ' взрывов');

    const count = 90 + Math.floor(Math.random() * 60);
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.6;
        const spd   = Math.random() * 9 + 1.5;
        const color = pal[Math.floor(Math.random() * pal.length)];
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            r:  Math.random() * 3.5 + 0.8,
            color,
            alpha:  1,
            decay:  Math.random() * 0.018 + 0.007,
            grav:   Math.random() * 0.18,
            trail:  [],
            glow:   Math.random() > 0.45,
        });
    }

    /* центральная вспышка */
    particles.push({
        x, y, vx: 0, vy: 0,
        r: 30, color: '#fff',
        alpha: 0.9, decay: 0.06,
        grav: 0, trail: [], glow: true,
    });

    shockwaves.push({ x, y, r: 0, alpha: 0.7 });
}

/* ── Touch / Click ────────────────────────────────────────── */
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) createExplosion(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('click', e => createExplosion(e.clientX, e.clientY));

/* ── First auto-blast ─────────────────────────────────────── */
setTimeout(() => createExplosion(W / 2, H / 2), 600);

/* ── Render loop ─────────────────────────────────────────── */
let last = 0;
function animate(now) {
    const dt = Math.min((now - last) / 16, 3);
    last = now;

    /* soft fade — creates motion blur / trails */
    ctx.fillStyle = 'rgba(0,0,8,0.18)';
    ctx.fillRect(0, 0, W, H);

    /* stars */
    for (const s of stars) {
        s.phase += s.speed * dt;
        const a = 0.25 + 0.5 * Math.abs(Math.sin(s.phase));
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    /* shockwaves */
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r     += 9 * dt;
        sw.alpha -= 0.045 * dt;
        if (sw.alpha <= 0) { shockwaves.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = sw.alpha * 0.45;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth   = 2;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    /* particles */
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 10) p.trail.shift();

        p.vx    *= 0.968;
        p.vy    *= 0.968;
        p.vy    += p.grav * dt;
        p.x     += p.vx * dt;
        p.y     += p.vy * dt;
        p.alpha -= p.decay * dt;

        if (p.alpha <= 0) { particles.splice(i, 1); continue; }

        /* trail */
        for (let t = 0; t < p.trail.length - 1; t++) {
            const ta = (t / p.trail.length) * p.alpha * 0.4;
            ctx.save();
            ctx.globalAlpha = ta;
            ctx.strokeStyle = p.color;
            ctx.lineWidth   = (t / p.trail.length) * p.r * 0.9;
            ctx.beginPath();
            ctx.moveTo(p.trail[t].x, p.trail[t].y);
            ctx.lineTo(p.trail[t + 1].x, p.trail[t + 1].y);
            ctx.stroke();
            ctx.restore();
        }

        /* body */
        ctx.save();
        ctx.globalAlpha = p.alpha;
        if (p.glow) {
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.5);
            g.addColorStop(0, p.color);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.shadowBlur  = 8;
            ctx.shadowColor = p.color;
            ctx.fillStyle   = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
