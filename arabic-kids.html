<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>حروفي ✨</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

    :root{--c1:#FF6B6B;--c2:#FF8E53}

    body{
      font-family:'Geeza Pro','Arabic Typesetting',Arial,sans-serif;
      height:100dvh;height:100vh;
      overflow:hidden;
      background:linear-gradient(135deg,var(--c1),var(--c2));
      transition:background .7s ease;
    }

    /* ═══════════════ SCREENS ═══════════════ */
    .screen{
      position:absolute;inset:0;
      display:flex;flex-direction:column;
      align-items:center;justify-content:space-between;
      padding:20px 16px 24px;
      opacity:0;pointer-events:none;
      transition:opacity .35s ease,transform .35s ease;
      transform:scale(.96);
    }
    .screen.active{opacity:1;pointer-events:all;transform:scale(1)}

    /* ═══════════════ HOME ═══════════════ */
    #home{background:linear-gradient(135deg,#667eea,#764ba2);justify-content:center;gap:24px}

    .home-title{
      font-size:clamp(44px,13vw,80px);
      color:#fff;text-align:center;
      text-shadow:0 6px 24px rgba(0,0,0,.3);
      line-height:1.2;direction:rtl;
    }
    .home-sub{font-size:clamp(15px,4vw,20px);color:rgba(255,255,255,.8);text-align:center}

    .levels{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}

    .lvl-card{
      border-radius:24px;
      padding:20px 24px;
      display:flex;align-items:center;gap:18px;
      cursor:pointer;border:3px solid rgba(255,255,255,.4);
      transition:transform .15s,box-shadow .15s;
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    }
    .lvl-card:active{transform:scale(.93)}
    .lvl-1{background:rgba(255,200,80,.85)}
    .lvl-2{background:rgba(80,200,255,.85)}

    .lvl-icon{font-size:clamp(40px,10vw,56px)}
    .lvl-info{text-align:left}
    .lvl-title{font-size:clamp(18px,5vw,24px);font-weight:bold;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.2);direction:rtl}
    .lvl-desc{font-size:clamp(13px,3.5vw,16px);color:rgba(255,255,255,.88);margin-top:2px}

    /* ═══════════════ SHARED HEADER ═══════════════ */
    .top-bar{
      width:100%;display:flex;
      align-items:center;justify-content:space-between;
      gap:12px;
    }
    .home-btn{
      width:50px;height:50px;border-radius:50%;
      background:rgba(255,255,255,.28);border:2.5px solid rgba(255,255,255,.5);
      color:#fff;font-size:22px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:transform .12s,background .12s;flex-shrink:0;
    }
    .home-btn:active{transform:scale(.85);background:rgba(255,255,255,.45)}

    .counter{
      background:rgba(255,255,255,.28);border-radius:20px;
      padding:7px 18px;color:#fff;
      font-size:clamp(15px,4vw,20px);font-weight:bold;
      flex:1;text-align:center;
    }

    /* ═══════════════ LEVEL 1 — LETTERS ═══════════════ */
    #lv1 .main{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:10px;width:100%;
    }

    .big-letter-wrap{
      position:relative;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
    }
    .big-letter{
      font-size:clamp(150px,38vw,220px);
      color:#fff;line-height:1;
      text-shadow:0 8px 0 rgba(0,0,0,.12),0 12px 40px rgba(0,0,0,.25);
      direction:rtl;
    }

    .name-reveal{
      font-size:clamp(30px,8vw,52px);
      font-weight:bold;color:#fff;direction:rtl;
      text-shadow:0 3px 12px rgba(0,0,0,.2);
      text-align:center;
      opacity:0;transform:translateY(10px);
      transition:opacity .4s,transform .4s;
      min-height:1.4em;
    }
    .name-reveal.show{opacity:1;transform:translateY(0)}

    /* ═══════════════ LEVEL 2 — WORDS ═══════════════ */
    #lv2 .main{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:14px;width:100%;
    }

    .letter-badge{
      background:rgba(255,255,255,.32);
      border:3px solid rgba(255,255,255,.6);
      border-radius:20px;padding:8px 24px;
      font-size:clamp(36px,9vw,56px);
      color:#fff;direction:rtl;
      text-shadow:0 2px 8px rgba(0,0,0,.2);
      cursor:pointer;
    }

    .big-emoji{
      font-size:clamp(100px,26vw,160px);
      cursor:pointer;
      filter:drop-shadow(0 8px 20px rgba(0,0,0,.22));
      line-height:1.1;
    }

    .word-pill{
      background:rgba(255,255,255,.32);
      border:3px solid rgba(255,255,255,.55);
      border-radius:40px;padding:10px 32px;
      font-size:clamp(26px,7vw,44px);
      color:#fff;direction:rtl;
      text-shadow:0 2px 8px rgba(0,0,0,.18);
      cursor:pointer;
    }

    /* ═══════════════ NAV BAR ═══════════════ */
    .nav-bar{
      width:100%;display:flex;
      align-items:center;justify-content:space-between;
      gap:12px;
    }
    .nav-btn{
      width:72px;height:72px;border-radius:50%;
      background:rgba(255,255,255,.28);
      border:3px solid rgba(255,255,255,.55);
      color:#fff;font-size:28px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;flex-shrink:0;
      transition:transform .12s,background .12s;
    }
    .nav-btn:active{transform:scale(.85);background:rgba(255,255,255,.45)}
    .nav-btn:disabled{opacity:.25;pointer-events:none}

    .speak-btn{
      flex:1;height:60px;border-radius:30px;
      background:rgba(255,255,255,.28);
      border:3px solid rgba(255,255,255,.55);
      color:#fff;font-size:18px;
      display:flex;align-items:center;justify-content:center;
      gap:8px;cursor:pointer;
      transition:transform .12s,background .12s;
    }
    .speak-btn:active{transform:scale(.93);background:rgba(255,255,255,.45)}

    /* ═══════════════ PROGRESS STARS ═══════════════ */
    .stars-row{
      display:flex;gap:5px;align-items:center;justify-content:center;
      flex:1;
    }
    .star-dot{
      font-size:clamp(14px,3.5vw,20px);
      transition:transform .2s;
      filter:grayscale(1);opacity:.4;
    }
    .star-dot.lit{filter:grayscale(0);opacity:1;transform:scale(1.2)}

    /* ═══════════════ ANIMATIONS ═══════════════ */
    @keyframes bounceIn{
      0%{transform:scale(.2) rotate(-15deg);opacity:0}
      50%{transform:scale(1.2) rotate(6deg)}
      70%{transform:scale(.92) rotate(-3deg)}
      100%{transform:scale(1) rotate(0);opacity:1}
    }
    @keyframes slideR{from{transform:translateX(110vw) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
    @keyframes slideL{from{transform:translateX(-110vw) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
    @keyframes tada{
      0%,100%{transform:scale(1) rotate(0)}
      15%{transform:scale(1.25) rotate(-8deg)}
      30%{transform:scale(1.25) rotate(8deg)}
      45%{transform:scale(1.12) rotate(-5deg)}
      60%{transform:scale(1.12) rotate(5deg)}
      80%{transform:scale(1.05) rotate(-2deg)}
    }
    @keyframes popIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
    @keyframes soundWave{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

    .do-slideR{animation:slideR .4s cubic-bezier(.25,.46,.45,.94) both}
    .do-slideL{animation:slideL .4s cubic-bezier(.25,.46,.45,.94) both}
    .do-bounce{animation:bounceIn .5s cubic-bezier(.36,.07,.19,.97) both}
    .do-tada  {animation:tada .55s ease both}
    .do-sound {animation:soundWave .45s ease infinite}

    /* ═══════════════ SPARKLES ═══════════════ */
    .spark{
      position:fixed;pointer-events:none;z-index:999;
      animation:sparkFly .9s ease forwards;
    }
    @keyframes sparkFly{
      0%{transform:translate(-50%,-50%) scale(1.3);opacity:1}
      100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0);opacity:0}
    }

    /* ═══════════════ CONFETTI ═══════════════ */
    .confetto{
      position:fixed;pointer-events:none;z-index:998;
      width:10px;height:10px;border-radius:2px;
      animation:confFall var(--dur) ease forwards;
    }
    @keyframes confFall{
      0%{transform:translate(0,0) rotate(0);opacity:1}
      100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}
    }

    /* ═══════════════ CELEBRATION ═══════════════ */
    #celebration{
      position:fixed;inset:0;z-index:400;
      background:rgba(0,0,0,.6);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:22px;
      opacity:0;visibility:hidden;
      transition:opacity .4s,visibility .4s;
    }
    #celebration.show{opacity:1;visibility:visible}
    .cel-msg{
      font-size:clamp(38px,12vw,70px);color:#fff;
      text-align:center;direction:rtl;line-height:1.3;
      text-shadow:0 4px 20px rgba(0,0,0,.4);
      animation:tada .7s ease .3s both;
    }
    .cel-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
    .cel-btn{
      padding:16px 36px;border-radius:50px;border:none;
      font-size:clamp(18px,5vw,24px);font-weight:bold;
      cursor:pointer;font-family:inherit;
      transition:transform .12s;
    }
    .cel-btn:active{transform:scale(.9)}
    .btn-home{background:#fff;color:#5F27CD}
    .btn-redo{background:rgba(255,255,255,.25);color:#fff;border:3px solid rgba(255,255,255,.5)}

    /* floating bubbles */
    .bubble{position:fixed;border-radius:50%;background:rgba(255,255,255,.1);animation:rise linear infinite;pointer-events:none}
    @keyframes rise{0%{transform:translateY(110vh);opacity:0}10%{opacity:.8}90%{opacity:.7}100%{transform:translateY(-10vh);opacity:0}}
  </style>
</head>
<body>

<!-- ══ HOME ══ -->
<div class="screen active" id="home" style="background:linear-gradient(135deg,#667eea,#764ba2)">
  <div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div class="home-title">حُرُوفِي ✨</div>
    <div class="home-sub">Арабский алфавит для малышей</div>
  </div>
  <div class="levels">
    <div class="lvl-card lvl-1" onclick="startLevel(1)">
      <div class="lvl-icon">🔤</div>
      <div class="lvl-info">
        <div class="lvl-title">الحُرُوف — Буквы</div>
        <div class="lvl-desc">Изучаем 28 букв по одной</div>
      </div>
      <div style="color:#fff;font-size:28px">▶</div>
    </div>
    <div class="lvl-card lvl-2" onclick="startLevel(2)">
      <div class="lvl-icon">🌟</div>
      <div class="lvl-info">
        <div class="lvl-title">الكَلِمَات — Слова</div>
        <div class="lvl-desc">Буква + слово + картинка</div>
      </div>
      <div style="color:#fff;font-size:28px">▶</div>
    </div>
  </div>
  <div style="font-size:13px;color:rgba(255,255,255,.5);text-align:center">
    Нажми на букву или картинку → услышишь произношение
  </div>
</div>

<!-- ══ LEVEL 1: LETTERS ══ -->
<div class="screen" id="lv1">
  <div class="top-bar">
    <button class="home-btn" onclick="goHome()">🏠</button>
    <div class="stars-row" id="stars1"></div>
    <div class="counter" id="ctr1" style="flex:0 0 auto;min-width:70px">١/٢٨</div>
  </div>

  <div class="main">
    <div class="big-letter-wrap" onclick="tapLetter1(event)">
      <div class="big-letter" id="l1char">ا</div>
    </div>
    <div class="name-reveal" id="l1name">ألف</div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="p1" onclick="go1(idx1-1)">◀</button>
    <button class="speak-btn" id="spk1" onclick="speak1()">
      <span id="si1">🔊</span><span>Послушать</span>
    </button>
    <button class="nav-btn" id="n1" onclick="go1(idx1+1)">▶</button>
  </div>
</div>

<!-- ══ LEVEL 2: WORDS ══ -->
<div class="screen" id="lv2">
  <div class="top-bar">
    <button class="home-btn" onclick="goHome()">🏠</button>
    <div class="stars-row" id="stars2"></div>
    <div class="counter" id="ctr2" style="flex:0 0 auto;min-width:70px">١/٢٨</div>
  </div>

  <div class="main">
    <div class="letter-badge" id="l2char" onclick="tapBadge(event)">ا</div>
    <div class="big-emoji" id="l2emoji" onclick="tapEmoji(event)">🦁</div>
    <div class="word-pill" id="l2word" onclick="tapWord(event)">أَسَد</div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="p2" onclick="go2(idx2-1)">◀</button>
    <button class="speak-btn" id="spk2" onclick="speak2()">
      <span id="si2">🔊</span><span>Послушать</span>
    </button>
    <button class="nav-btn" id="n2" onclick="go2(idx2+1)">▶</button>
  </div>
</div>

<!-- ══ CELEBRATION ══ -->
<div id="celebration">
  <div class="cel-msg">🎉 أَحْسَنْت! 🎉<br>
    <span style="font-size:.55em">Молодец! Все буквы пройдены!</span>
  </div>
  <div class="cel-row">
    <button class="cel-btn btn-home" onclick="restartHome()">🏠 Главная</button>
    <button class="cel-btn btn-redo" onclick="restartLevel()">🔄 Ещё раз!</button>
  </div>
</div>

<script>
/* ══════════════════ DATA ══════════════════ */
const L = [
  {l:'ا',name:'أَلِف', word:'أَسَد',   emoji:'🦁', color:['#FF6B6B','#FF8E53']},
  {l:'ب',name:'بَاء',  word:'بَطَّة',  emoji:'🦆', color:['#FF9F43','#FFDA79']},
  {l:'ت',name:'تَاء',  word:'تُفَّاح', emoji:'🍎', color:['#00B894','#55EFC4']},
  {l:'ث',name:'ثَاء',  word:'ثَعْلَب', emoji:'🦊', color:['#E55039','#F39C12']},
  {l:'ج',name:'جِيم',  word:'جَمَل',   emoji:'🐪', color:['#48DBFB','#0ABDE3']},
  {l:'ح',name:'حَاء',  word:'حِصَان',  emoji:'🐴', color:['#54A0FF','#2E86DE']},
  {l:'خ',name:'خَاء',  word:'خَرُوف',  emoji:'🐑', color:['#A29BFE','#6C5CE7']},
  {l:'د',name:'دَال',  word:'دُبّ',    emoji:'🐻', color:['#FF9F43','#E17055']},
  {l:'ذ',name:'ذَال',  word:'ذَرَة',   emoji:'🌽', color:['#74B9FF','#0984E3']},
  {l:'ر',name:'رَاء',  word:'رَبِيع',  emoji:'🌷', color:['#FF6B6B','#C0392B']},
  {l:'ز',name:'زَاي',  word:'زَهْرَة', emoji:'🌸', color:['#FD79A8','#E84393']},
  {l:'س',name:'سِين',  word:'سَمَكَة', emoji:'🐟', color:['#48DBFB','#00CEC9']},
  {l:'ش',name:'شِين',  word:'شَمْس',   emoji:'☀️', color:['#FECA57','#F0932B']},
  {l:'ص',name:'صَاد',  word:'صَقْر',   emoji:'🦅', color:['#54A0FF','#0984E3']},
  {l:'ض',name:'ضَاد',  word:'ضُفْدَع', emoji:'🐸', color:['#00B894','#009432']},
  {l:'ط',name:'طَاء',  word:'طَمَاطِم',emoji:'🍅', color:['#FF6B6B','#B71540']},
  {l:'ظ',name:'ظَاء',  word:'ظَبْي',   emoji:'🦌', color:['#A29BFE','#5F27CD']},
  {l:'ع',name:'عَيْن', word:'عِنَب',   emoji:'🍇', color:['#6C5CE7','#A29BFE']},
  {l:'غ',name:'غَيْن', word:'غَابَة',  emoji:'🌳', color:['#00B894','#27AE60']},
  {l:'ف',name:'فَاء',  word:'فَرَاشَة',emoji:'🦋', color:['#FD79A8','#6C5CE7']},
  {l:'ق',name:'قَاف',  word:'قِطَّة',  emoji:'🐱', color:['#FDCB6E','#E17055']},
  {l:'ك',name:'كَاف',  word:'كَلْب',   emoji:'🐶', color:['#74B9FF','#2E86DE']},
  {l:'ل',name:'لَام',  word:'لَيْمُون',emoji:'🍋', color:['#FECA57','#F9CA24']},
  {l:'م',name:'مِيم',  word:'مَوْز',   emoji:'🍌', color:['#FF9F43','#FDCB6E']},
  {l:'ن',name:'نُون',  word:'نَجْمَة', emoji:'⭐', color:['#54A0FF','#5352ED']},
  {l:'ه',name:'هَاء',  word:'هِلَال',  emoji:'🌙', color:['#1A237E','#42A5F5']},
  {l:'و',name:'وَاو',  word:'وَرْدَة', emoji:'🌹', color:['#C0392B','#FF6B6B']},
  {l:'ي',name:'يَاء',  word:'يَد',     emoji:'🤚', color:['#FF9F43','#EE5A24']},
];

/* ══════════════════ UTILS ══════════════════ */
const AR='٠١٢٣٤٥٦٧٨٩'.split('');
const toAr=n=>String(n).replace(/\d/g,d=>AR[d]);

/* Audio context (reuse single instance) */
let _ctx=null;
function getAudioCtx(){
  if(!_ctx) _ctx=new(window.AudioContext||window.webkitAudioContext)();
  return _ctx;
}
function playPop(freq=700,dur=0.18){
  try{
    const ctx=getAudioCtx();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';
    o.frequency.setValueAtTime(freq,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*0.5,ctx.currentTime+dur);
    g.gain.setValueAtTime(0.28,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.start();o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playChime(){
  [523,659,784,1047].forEach((f,i)=>{
    setTimeout(()=>playPop(f,0.22),i*110);
  });
}
function playWin(){
  [523,659,784,1047,1319,1568].forEach((f,i)=>{
    setTimeout(()=>playPop(f,0.25),i*120);
  });
}

/* TTS */
let arVoice=null;
function loadVoices(){
  const vs=window.speechSynthesis?.getVoices()||[];
  arVoice=vs.find(v=>v.lang.startsWith('ar'))||null;
}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}

function say(text,speed=0.65){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ar-SA';u.rate=speed;u.pitch=1.15;
  if(arVoice)u.voice=arVoice;
  speechSynthesis.speak(u);
}

/* Particles */
const SPKS=['⭐','✨','🌟','💫','🎉','🌈','💥','🎊'];
function sparks(cx,cy,n=8){
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='spark';
    const a=(i/n)*360+Math.random()*35,d=70+Math.random()*100;
    const r=a*Math.PI/180;
    el.style.cssText=`left:${cx}px;top:${cy}px;font-size:${16+Math.random()*16}px;--tx:${Math.cos(r)*d}px;--ty:${Math.sin(r)*d}px;animation-delay:${Math.random()*.1}s`;
    el.textContent=SPKS[~~(Math.random()*SPKS.length)];
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1000);
  }
}
function confetti(n=30){
  const colors=['#FF6B6B','#FECA57','#48DBFB','#FF9FF3','#54A0FF','#00B894','#fff'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='confetto';
    const cx=Math.random()*window.innerWidth;
    const tx=(Math.random()-0.5)*300,ty=window.innerHeight+100;
    const dur=(1.2+Math.random())+'s';
    el.style.cssText=`
      left:${cx}px;top:-20px;
      background:${colors[~~(Math.random()*colors.length)]};
      border-radius:${Math.random()>.5?'50%':'2px'};
      width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
      --tx:${tx}px;--ty:${ty}px;--rot:${Math.random()*720}deg;--dur:${dur};
      animation-delay:${Math.random()*.3}s
    `;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
}

/* BG */
function setBg(c){document.body.style.background=`linear-gradient(135deg,${c[0]},${c[1]})`}

/* Screen switcher */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* Stars progress row */
function buildStars(containerId,total=28,lit=0){
  const el=document.getElementById(containerId);
  el.innerHTML='';
  // Show 7 groups (each = 4 letters)
  const groups=7;
  for(let i=0;i<groups;i++){
    const s=document.createElement('span');
    s.className='star-dot'+(lit>(i*4)?'  lit':'');
    s.textContent='⭐';
    el.appendChild(s);
  }
}
function updateStars(id,idx){
  const dots=document.getElementById(id).querySelectorAll('.star-dot');
  dots.forEach((d,i)=>d.classList.toggle('lit',idx>i*4));
}

/* ══════════════════ LEVEL 1 ══════════════════ */
let idx1=0,busy1=false,activeLevel=0;

function startLevel(n){
  playPop(600,.2);
  activeLevel=n;
  if(n===1){
    showScreen('lv1');
    buildStars('stars1');
    render1(idx1,'none');
    setTimeout(()=>speak1(),700);
  } else {
    showScreen('lv2');
    buildStars('stars2');
    render2(idx2,'none');
    setTimeout(()=>speak2(),700);
  }
}

function render1(i,dir){
  const d=L[i];
  setBg(d.color);
  const char=document.getElementById('l1char');
  const nameEl=document.getElementById('l1name');
  // slide animation
  char.style.animation='none';void char.offsetHeight;
  char.style.animation=dir==='right'?'slideR .4s cubic-bezier(.25,.46,.45,.94) both':
                        dir==='left' ?'slideL .4s cubic-bezier(.25,.46,.45,.94) both':
                                      'bounceIn .5s cubic-bezier(.36,.07,.19,.97) both';
  char.textContent=d.l;
  nameEl.classList.remove('show');
  nameEl.textContent=d.name;

  document.getElementById('ctr1').textContent=`${toAr(i+1)}/${toAr(28)}`;
  document.getElementById('p1').disabled=i===0;
  document.getElementById('n1').disabled=i===L.length-1;
  updateStars('stars1',i);
}

function go1(i){
  if(i<0||i>=L.length)return;
  const dir=i>idx1?'right':'left';
  idx1=i;
  render1(i,dir);
  setTimeout(()=>speak1(),350);
}

function speak1(){
  const si=document.getElementById('si1');
  si.textContent='🔈';
  document.getElementById('spk1').classList.add('do-sound');
  say(L[idx1].name);
  setTimeout(()=>{
    si.textContent='🔊';
    document.getElementById('spk1').classList.remove('do-sound');
    // reveal name
    document.getElementById('l1name').classList.add('show');
  },1200);
}

function tapLetter1(e){
  playPop(700,.18);
  sparks(e.clientX,e.clientY,10);
  const el=document.getElementById('l1char');
  el.style.animation='none';void el.offsetHeight;el.style.animation='tada .55s ease both';
  speak1();
}

/* ══════════════════ LEVEL 2 ══════════════════ */
let idx2=0;

function render2(i,dir){
  const d=L[i];
  setBg(d.color);
  const badge=document.getElementById('l2char');
  const emoji=document.getElementById('l2emoji');
  const word =document.getElementById('l2word');

  // animate main content block
  [badge,emoji,word].forEach(el=>{
    el.style.animation='none';void el.offsetHeight;
    el.style.animation=dir==='right'?'slideR .38s cubic-bezier(.25,.46,.45,.94) both':
                        dir==='left' ?'slideL .38s cubic-bezier(.25,.46,.45,.94) both':
                                      'bounceIn .45s cubic-bezier(.36,.07,.19,.97) both';
  });
  emoji.style.animationDelay='.06s';
  word.style.animationDelay='.12s';

  badge.textContent=d.l;
  emoji.textContent=d.emoji;
  word.textContent =d.word;

  document.getElementById('ctr2').textContent=`${toAr(i+1)}/${toAr(28)}`;
  document.getElementById('p2').disabled=i===0;
  document.getElementById('n2').disabled=i===L.length-1;
  updateStars('stars2',i);
}

function go2(i){
  if(i<0||i>=L.length)return;
  const dir=i>idx2?'right':'left';
  idx2=i;
  render2(i,dir);
  setTimeout(()=>speak2(),350);
  if(i===L.length-1)setTimeout(celebrate,4500);
}

function speak2(){
  const si=document.getElementById('si2');
  si.textContent='🔈';
  document.getElementById('spk2').classList.add('do-sound');
  say(L[idx2].name,0.65);
  setTimeout(()=>{
    say(L[idx2].word,0.62);
    setTimeout(()=>{
      si.textContent='🔊';
      document.getElementById('spk2').classList.remove('do-sound');
    },1500);
  },1000);
}

function tapEmoji(e){
  playPop(500,.2);
  sparks(e.clientX,e.clientY,12);
  const el=document.getElementById('l2emoji');
  el.style.animation='none';void el.offsetHeight;el.style.animation='tada .55s ease both';
  say(L[idx2].word,.6);
}
function tapBadge(e){
  playPop(700,.18);
  sparks(e.clientX,e.clientY,6);
  say(L[idx2].name,.65);
}
function tapWord(e){
  playPop(550,.2);
  sparks(e.clientX,e.clientY,6);
  say(L[idx2].word,.6);
}

/* ══════════════════ CELEBRATION ══════════════════ */
function celebrate(){
  playWin();
  confetti(50);
  setTimeout(()=>confetti(40),700);
  document.getElementById('celebration').classList.add('show');
}
function restartHome(){
  document.getElementById('celebration').classList.remove('show');
  goHome();
}
function restartLevel(){
  document.getElementById('celebration').classList.remove('show');
  if(activeLevel===1){idx1=0;render1(0,'none');speak1();}
  else               {idx2=0;render2(0,'none');speak2();}
}

/* ══════════════════ HOME ══════════════════ */
function goHome(){
  playPop(400,.15);
  speechSynthesis?.cancel?.();
  setBg(['#667eea','#764ba2']);
  showScreen('home');
}

/* ══════════════════ SWIPE ══════════════════ */
let tx0=0,ty0=0;
document.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)){
    if(document.getElementById('lv1').classList.contains('active')){
      dx<0?go1(idx1+1):go1(idx1-1);
    } else if(document.getElementById('lv2').classList.contains('active')){
      dx<0?go2(idx2+1):go2(idx2-1);
    }
  }
},{passive:true});

/* ══════════════════ KEYBOARD ══════════════════ */
document.addEventListener('keydown',e=>{
  const lv1=document.getElementById('lv1').classList.contains('active');
  const lv2=document.getElementById('lv2').classList.contains('active');
  if(e.key==='ArrowRight'){ lv1?go1(idx1+1):lv2&&go2(idx2+1); }
  if(e.key==='ArrowLeft') { lv1?go1(idx1-1):lv2&&go2(idx2-1); }
  if(e.key===' '||e.key==='Enter'){ lv1?speak1():lv2&&speak2(); }
  if(e.key==='Escape') goHome();
});

/* ══════════════════ FLOATING BUBBLES ══════════════════ */
for(let i=0;i<12;i++){
  const b=document.createElement('div');b.className='bubble';
  const s=20+Math.random()*70;
  b.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;animation-duration:${7+Math.random()*9}s;animation-delay:${Math.random()*7}s`;
  document.body.appendChild(b);
}

/* Init home bg */
setBg(['#667eea','#764ba2']);
</script>
