<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нур — Портал изучения арабского языка и Корана (A1–B2)</title>
  <meta name="description" content="Бесплатный портал для изучения арабского языка и языка Корана на русском: алфавит, словарь, разговорник, грамматика A1–B2, чтение и интерактивные задания." />
</head>
<body>
<style>
  :root {
    --ground: #F5EFE2;
    --surface: #FDFAF3;
    --surface-2: #F0E7D4;
    --ink: #221B12;
    --muted: #6E6353;
    --emerald: #0C6B57;
    --emerald-deep: #094E41;
    --emerald-soft: #0c6b5714;
    --gold: #B0843A;
    --gold-soft: #b0843a1f;
    --line: #E4D8C0;
    --line-strong: #d6c6a6;
    --success: #2E7D5B;
    --warning: #B67A1E;
    --error: #B14A34;
    --shadow: 0 1px 2px #2a1e0a0a, 0 8px 24px -12px #2a1e0a22;
    --shadow-lg: 0 2px 4px #2a1e0a10, 0 20px 48px -18px #2a1e0a33;
    --r-sm: 10px; --r-md: 16px; --r-lg: 22px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --arabic: "Amiri", "Scheherazade New", "Traditional Arabic", "Al Bayan", "Geeza Pro", "Noto Naskh Arabic", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #14110B; --surface: #1D1810; --surface-2: #251F14; --ink: #F0E7D5;
      --muted: #A99B82; --emerald: #45B79C; --emerald-deep: #2C8C74; --emerald-soft: #45b79c1a;
      --gold: #D9B061; --gold-soft: #d9b06120; --line: #362D1D; --line-strong: #473b26;
      --success: #4FB587; --warning: #D6A340; --error: #D97052;
      --shadow: 0 1px 2px #00000030, 0 8px 24px -12px #00000060;
      --shadow-lg: 0 2px 4px #00000040, 0 20px 48px -18px #00000070;
    }
  }
  :root[data-theme="light"] {
    --ground: #F5EFE2; --surface: #FDFAF3; --surface-2: #F0E7D4; --ink: #221B12;
    --muted: #6E6353; --emerald: #0C6B57; --emerald-deep: #094E41;
    --emerald-soft: #0c6b5714; --gold: #B0843A; --gold-soft: #b0843a1f; --line: #E4D8C0;
    --line-strong: #d6c6a6; --success: #2E7D5B; --warning: #B67A1E; --error: #B14A34;
    --shadow: 0 1px 2px #2a1e0a0a, 0 8px 24px -12px #2a1e0a22;
    --shadow-lg: 0 2px 4px #2a1e0a10, 0 20px 48px -18px #2a1e0a33;
  }
  :root[data-theme="dark"] {
    --ground: #14110B; --surface: #1D1810; --surface-2: #251F14; --ink: #F0E7D5;
    --muted: #A99B82; --emerald: #45B79C; --emerald-deep: #2C8C74; --emerald-soft: #45b79c1a;
    --gold: #D9B061; --gold-soft: #d9b06120; --line: #362D1D; --line-strong: #473b26;
    --success: #4FB587; --warning: #D6A340; --error: #D97052;
    --shadow: 0 1px 2px #00000030, 0 8px 24px -12px #00000060;
    --shadow-lg: 0 2px 4px #00000040, 0 20px 48px -18px #00000070;
  }

  * { box-sizing: border-box; }
  #app, #app *::before, #app *::after { box-sizing: border-box; }
  #app {
    margin: 0; font-family: var(--sans); color: var(--ink);
    background:
      radial-gradient(1200px 600px at 100% -10%, var(--emerald-soft), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, var(--gold-soft), transparent 55%),
      var(--ground);
    min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #app h1, #app h2, #app h3, #app h4 { font-family: var(--serif); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
  #app p { margin: 0; }
  #app a { color: var(--emerald); text-decoration: none; }
  #app button { font-family: inherit; cursor: pointer; }
  #app ::selection { background: var(--gold-soft); }
  .ar { font-family: var(--arabic); direction: rtl; unicode-bidi: isolate; }
  .tab-num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
  .muted { color: var(--muted); }
  #app :focus-visible { outline: 2.5px solid var(--emerald); outline-offset: 2px; border-radius: 4px; }

  .topbar {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px;
    padding: 12px clamp(14px, 4vw, 40px);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: saturate(1.2) blur(12px); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand .seal {
    width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(150deg, var(--emerald), var(--emerald-deep)); color: #fdf7e6; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .brand .seal span { font-family: var(--arabic); font-size: 26px; line-height: 1; margin-top: -2px; text-shadow: 0 1px 2px #0004; }
  .brand .seal::after { content:""; position:absolute; inset:0; background: radial-gradient(circle at 30% 20%, #ffffff30, transparent 60%); }
  .brand b { font-family: var(--serif); font-size: 20px; letter-spacing: .01em; display: block; }
  .brand small { color: var(--muted); font-size: 11.5px; letter-spacing: .04em; display:block; margin-top:-2px;}
  .icon-btn {
    width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); display: grid; place-items: center; transition: background .15s, border-color .15s, transform .15s;
  }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 19px; height: 19px; }

  .shell { display: flex; align-items: flex-start; gap: 0; }
  .sidebar { position: sticky; top: 67px; align-self: flex-start; width: 244px; flex: none; padding: 22px 14px; height: calc(100vh - 67px); overflow-y: auto; }
  .nav-group + .nav-group { margin-top: 20px; }
  .nav-group h5 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 12px; font-family: var(--sans); font-weight: 700; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 11px; border: none;
    background: transparent; color: var(--ink); font-size: 14.5px; font-weight: 500; text-align: left; transition: background .14s, color .14s;
  }
  .nav-item .ni-ico { width: 20px; height: 20px; flex: none; color: var(--muted); transition: color .14s; }
  .nav-item .ni-ico svg { width: 20px; height: 20px; display:block; }
  .nav-item:hover { background: var(--surface); }
  .nav-item.active { background: var(--emerald); color: #fdf7e6; box-shadow: var(--shadow); }
  .nav-item.active .ni-ico { color: #fdf7e6; }
  .nav-item .ni-lvl { margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing:.05em; padding: 2px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
  .nav-item.active .ni-lvl { background: #ffffff2a; color: #fdf7e6; }

  main { flex: 1; min-width: 0; padding: clamp(20px, 3.4vw, 44px) clamp(16px, 4vw, 52px) 80px; }
  .view { display: none; animation: fade .35s ease both; max-width: 1080px; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view, #app * { animation: none !important; transition: none !important; } }

  .backlink { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; color: var(--emerald); background: var(--surface); border: 1px solid var(--line-strong); padding: 8px 14px; border-radius: 999px; margin-bottom: 18px; }
  .backlink:hover { background: var(--surface-2); }

  .page-head { margin-bottom: 26px; }
  .page-head h2 { font-size: clamp(26px, 3.6vw, 36px); margin: 6px 0 6px; letter-spacing: -0.01em; }
  .page-head p { color: var(--muted); max-width: 62ch; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
  .grid { display: grid; gap: 16px; }
  .g-auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

  .hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: clamp(28px, 5vw, 52px); color: #fbf5e6;
    background: linear-gradient(135deg, var(--emerald-deep), var(--emerald) 70%, #0c7d61); box-shadow: var(--shadow-lg); }
  .hero::before { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none; background-image: var(--girih); background-size: 210px 210px; }
  .hero::after { content:""; position:absolute; right:-80px; top:-90px; width:320px; height:320px; border-radius:50%; background: radial-gradient(circle, #ffe9a840, transparent 65%); }
  .hero .inner { position: relative; z-index: 1; max-width: 640px; }
  .hero .ar-big { font-family: var(--arabic); font-size: clamp(42px, 9vw, 82px); line-height: 1; margin-bottom: 10px; color: #ffe6a8; text-shadow: 0 2px 14px #0006; }
  .hero h1 { font-size: clamp(26px, 4.4vw, 42px); color: #fff; margin-bottom: 12px; }
  .hero p { color: #eadfbf; font-size: clamp(15px, 2vw, 17px); max-width: 54ch; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14.5px; border: 1px solid transparent; transition: transform .15s, filter .15s, background .15s; }
  .btn:active { transform: translateY(1px); }
  .btn-gold { background: linear-gradient(135deg, #e9c877, var(--gold)); color: #3a2708; box-shadow: 0 6px 18px -8px #0007; }
  .btn-gold:hover { filter: brightness(1.05); }
  .btn-ghost { background: #ffffff1f; color: #fff; border-color: #ffffff40; }
  .btn-ghost:hover { background: #ffffff2e; }
  .btn-solid { background: var(--emerald); color: #fdf7e6; }
  .btn-solid:hover { filter: brightness(1.06); }
  .btn-outline { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn-outline:hover { background: var(--surface-2); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 22px; }
  .stat { padding: 18px 20px; }
  .stat .num { font-family: var(--serif); font-size: 30px; color: var(--emerald); line-height: 1; }
  .stat .lbl { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .progress-track { height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 10px; border: 1px solid var(--line); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--gold)); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }

  .home-card { padding: 22px; display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); transition: transform .16s, box-shadow .16s, border-color .16s; color: var(--ink); }
  button.home-card { width: 100%; cursor: pointer; }
  .home-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  .home-card .hc-ico { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--emerald-soft); color: var(--emerald); }
  .home-card .hc-ico svg { width: 24px; height: 24px; }
  .home-card h3 { font-size: 19px; }
  .home-card p { color: var(--muted); font-size: 14px; }
  .home-card .go { margin-top: auto; color: var(--emerald); font-weight: 600; font-size: 13.5px; display: inline-flex; align-items:center; gap:6px; }

  .sec-title { display: flex; align-items: baseline; gap: 12px; margin: 40px 0 16px; }
  .sec-title h3 { font-size: 22px; }
  .sec-title .rule { flex: 1; height: 1px; background: var(--line-strong); }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--muted); pointer-events:none; }
  .search-wrap input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 15px; font-family: inherit; box-shadow: var(--shadow); }
  .search-wrap input::placeholder { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; transition: all .14s; }
  .chip:hover { border-color: var(--emerald); }
  .chip.active { background: var(--emerald); color: #fdf7e6; border-color: var(--emerald); }
  .chip.gold.active { background: var(--gold); border-color: var(--gold); color: #3a2708; }

  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
  .vcard { position: relative; padding: 18px 18px 16px; text-align: left; }
  .vcard .word { font-family: var(--arabic); direction: rtl; font-size: 34px; line-height: 1.3; color: var(--ink); }
  .vcard .translit { font-family: var(--mono); font-size: 13.5px; color: var(--emerald); margin-top: 2px; letter-spacing: .02em; }
  .vcard .mean { font-size: 15.5px; margin-top: 7px; font-weight: 500; }
  .vcard .meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); letter-spacing: .02em; }
  .tag.pos { background: var(--emerald-soft); color: var(--emerald); }
  .tag.freq { background: var(--gold-soft); color: var(--gold); font-variant-numeric: tabular-nums; }
  .star { position: absolute; right: 12px; bottom: 12px; width: 34px; height: 34px; border-radius: 10px; border: none; background: transparent; color: var(--line-strong); display: grid; place-items: center; transition: color .14s, transform .14s; }
  .star:hover { transform: scale(1.15); }
  .star svg { width: 21px; height: 21px; }
  .star.on { color: var(--gold); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .ar { font-size: 50px; opacity: .3; }

  .letters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .letter { padding: 16px 14px; text-align: center; transition: transform .16s, box-shadow .16s, border-color .16s; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); color: var(--ink); }
  .letter:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--gold); }
  .letter .glyph { font-family: var(--arabic); font-size: 46px; line-height: 1.1; color: var(--emerald); }
  .letter .lname { font-weight: 600; font-size: 14px; margin-top: 4px; }
  .letter .ltr { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .letter .hint2 { font-size: 11.5px; color: var(--muted); margin-top: 6px; min-height: 28px; }
  .forms-row { display: flex; justify-content: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-strong); }
  .form-cell { flex: 1; }
  .form-cell .fg { font-family: var(--arabic); font-size: 22px; color: var(--ink); line-height: 1.4; }
  .form-cell .fl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  .harakat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .haraka { padding: 16px; display: flex; align-items: center; gap: 14px; }
  .haraka .sample { font-family: var(--arabic); font-size: 40px; color: var(--gold); width: 54px; text-align: center; flex:none; }
  .haraka h4 { font-size: 15px; }
  .haraka p { font-size: 13px; color: var(--muted); }

  .phrase { padding: 16px 18px; display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .phrase .body { flex: 1; min-width: 0; }
  .phrase .ar-ph { font-family: var(--arabic); direction: rtl; font-size: 25px; line-height: 1.5; color: var(--ink); }
  .phrase .translit { font-family: var(--mono); font-size: 13px; color: var(--emerald); margin: 3px 0; }
  .phrase .ru { font-size: 14.5px; }
  .phrase .num { font-family: var(--serif); font-size: 14px; color: var(--gold); width: 28px; text-align: center; flex: none; }

  .lesson { margin-bottom: 14px; overflow: hidden; }
  .lesson summary { list-style: none; padding: 18px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .lesson summary::-webkit-details-marker { display: none; }
  .lesson summary .lv { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--emerald-soft); color: var(--emerald); flex:none; }
  .lesson summary h4 { font-size: 16.5px; flex: 1; }
  .lesson summary .caret { color: var(--muted); transition: transform .2s; }
  .lesson[open] summary .caret { transform: rotate(90deg); }
  .lesson .content { padding: 0 20px 20px; border-top: 1px solid var(--line); margin-top: -2px; }
  .lesson .content > * { margin-top: 14px; }
  .lesson .content p { color: var(--ink); font-size: 14.5px; }
  .lesson .content .rule-box { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; border-left: 3px solid var(--gold); }
  .ex-table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
  .ex-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 14px; background: var(--surface-2); font-weight: 700; }
  .ex-table th:last-child, .ex-table td:last-child { text-align: right; }
  .ex-table td { padding: 11px 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
  .ex-table .ar-cell { font-family: var(--arabic); direction: rtl; font-size: 24px; }
  .ex-table .tr-cell { font-family: var(--mono); font-size: 13px; color: var(--emerald); }
  .tbl-wrap { overflow-x: auto; }

  .reader { padding: 24px clamp(18px, 3vw, 32px); margin-bottom: 18px; }
  .reader .r-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .reader .r-head .lv { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
  .reader .r-head h4 { font-size: 19px; }
  .verse { padding: 14px 0; border-bottom: 1px dashed var(--line-strong); }
  .verse:last-child { border-bottom: none; }
  .verse .ar-line { font-family: var(--arabic); direction: rtl; font-size: clamp(24px, 4vw, 32px); line-height: 2; color: var(--ink); }
  .verse .tl-line { font-family: var(--mono); font-size: 13.5px; color: var(--emerald); margin: 6px 0 2px; }
  .verse .ru-line { font-size: 15px; color: var(--muted); }

  .ex-switch { display: inline-flex; padding: 5px; gap: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 20px; }
  .ex-switch button { padding: 9px 18px; border-radius: 10px; border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; transition: all .14s; }
  .ex-switch button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .flashcard-stage { display: grid; place-items: center; gap: 20px; padding: 20px 0; }
  .flashcard { width: min(420px, 92%); aspect-ratio: 3/2; perspective: 1200px; background: transparent; border: none; padding: 0; }
  .fc-inner { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flashcard.flipped .fc-inner { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--r-lg); display: grid; place-content: center; text-align: center; gap: 8px; padding: 24px; border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
  .fc-front { background: linear-gradient(150deg, var(--surface), var(--surface-2)); }
  .fc-front .ar { font-size: clamp(48px, 12vw, 78px); color: var(--emerald); line-height: 1.2; }
  .fc-front .hint { color: var(--muted); font-size: 13px; }
  .fc-back { background: linear-gradient(150deg, var(--emerald-deep), var(--emerald)); color: #fbf5e6; transform: rotateY(180deg); }
  .fc-back .translit { font-family: var(--mono); font-size: 18px; color: #ffe6a8; }
  .fc-back .mean { font-size: 26px; font-family: var(--serif); }
  .fc-back .cat { font-size: 13px; color: #eadfbf; }
  .fc-controls { display: flex; align-items: center; gap: 12px; }
  .fc-count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 64px; text-align: center; }

      <div class="rule-box"><p><span class="ar" style="font-size:22px">الْبَيْتُ كَبِيرٌ</span> — <span class="tr-cell">al-baytu kabīrun</span> — <b>Дом большой.</b><br><span class="ar" style="font-size:22px">الطَّالِبُ مُجْتَهِدٌ</span> — <span class="tr-cell">aṭ-ṭālibu mujtahidun</span> — <b>Студент старательный.</b></p></div>` },
    { lv:"A2", t:"Род: мужской и женский", body:`
      <p>Большинство слов мужского рода. Женский род чаще всего образуется окончанием <b>та марбута</b> <span class="ar">ة</span>:</p>
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>М. род</th><th>Ж. род</th><th>Значение</th></tr></thead><tbody>
      <tr><td class="ar-cell">مُعَلِّم</td><td class="ar-cell">مُعَلِّمَة</td><td>учитель / учительница</td></tr>
      <tr><td class="ar-cell">كَبِير</td><td class="ar-cell">كَبِيرَة</td><td>большой / большая</td></tr>
      <tr><td class="ar-cell">طَالِب</td><td class="ar-cell">طَالِبَة</td><td>студент / студентка</td></tr></tbody></table></div>` },
    { lv:"A2", t:"Множественное число", body:`
      <p>Есть <b>правильное</b> (по окончанию) и <b>ломаное</b> (меняется основа) множественное число.</p>
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Ед.ч.</th><th>Мн.ч.</th><th>Тип</th></tr></thead><tbody>
      <tr><td class="ar-cell">مُعَلِّم</td><td class="ar-cell">مُعَلِّمُونَ</td><td>прав. м.р.</td></tr>
      <tr><td class="ar-cell">مُعَلِّمَة</td><td class="ar-cell">مُعَلِّمَات</td><td>прав. ж.р.</td></tr>
      <tr><td class="ar-cell">كِتَاب</td><td class="ar-cell">كُتُب</td><td>ломаное</td></tr>
      <tr><td class="ar-cell">وَلَد</td><td class="ar-cell">أَوْلَاد</td><td>ломаное</td></tr></tbody></table></div>` },
    { lv:"A2", t:"Идафа — принадлежность", body:`
      <p><b>Идафа</b> — сопряжённое сочетание двух имён («книга ученика»). Первое имя — <b>без артикля</b>, второе — в родительном падеже.</p>
      <div class="rule-box"><p><span class="ar" style="font-size:22px">كِتَابُ الطَّالِبِ</span> — <span class="tr-cell">kitābu ṭ-ṭālibi</span> — <b>книга ученика.</b><br><span class="ar" style="font-size:22px">بَابُ الْبَيْتِ</span> — <span class="tr-cell">bābu l-bayti</span> — <b>дверь дома.</b></p></div>` },
    { lv:"A2", t:"Указательные местоимения", body:`
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Слово</th><th>Значение</th><th>Транскр.</th></tr></thead><tbody>
      <tr><td class="ar-cell">هٰذَا</td><td>этот (м)</td><td class="tr-cell">hādhā</td></tr>
      <tr><td class="ar-cell">هٰذِهِ</td><td>эта (ж)</td><td class="tr-cell">hādhihi</td></tr>
      <tr><td class="ar-cell">ذٰلِكَ</td><td>тот (м)</td><td class="tr-cell">dhālika</td></tr>
      <tr><td class="ar-cell">تِلْكَ</td><td>та (ж)</td><td class="tr-cell">tilka</td></tr></tbody></table></div>
      <p class="muted">Пример: <span class="ar">هٰذَا كِتَابٌ</span> — <span class="tr-cell">hādhā kitābun</span> — «Это книга».</p>` },
    { lv:"A2", t:"Предлоги места", body:`
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Предлог</th><th>Значение</th><th>Транскр.</th></tr></thead><tbody>
      <tr><td class="ar-cell">فِي</td><td>в</td><td class="tr-cell">fī</td></tr>
      <tr><td class="ar-cell">عَلَى</td><td>на</td><td class="tr-cell">ʿalā</td></tr>
      <tr><td class="ar-cell">تَحْتَ</td><td>под</td><td class="tr-cell">taḥta</td></tr>
      <tr><td class="ar-cell">فَوْقَ</td><td>над</td><td class="tr-cell">fawqa</td></tr>
      <tr><td class="ar-cell">أَمَامَ</td><td>перед</td><td class="tr-cell">amāma</td></tr>
      <tr><td class="ar-cell">بَيْنَ</td><td>между</td><td class="tr-cell">bayna</td></tr></tbody></table></div>
      <p class="muted"><span class="ar">الْكِتَابُ عَلَى الطَّاوِلَةِ</span> — «Книга на столе».</p>` },
    { lv:"B1", t:"Прошедшее время (аль-мади)", body:`
      <p>Глагол прошедшего времени спрягается окончаниями. Основа — 3 л. ед.ч. м.р. (<span class="ar">كَتَبَ</span> «он написал»).</p>
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Лицо</th><th>Форма</th><th>Транскр.</th></tr></thead><tbody>
      <tr><td>я написал</td><td class="ar-cell">كَتَبْتُ</td><td class="tr-cell">katabtu</td></tr>
      <tr><td>ты написал</td><td class="ar-cell">كَتَبْتَ</td><td class="tr-cell">katabta</td></tr>
      <tr><td>он написал</td><td class="ar-cell">كَتَبَ</td><td class="tr-cell">kataba</td></tr>
      <tr><td>она написала</td><td class="ar-cell">كَتَبَتْ</td><td class="tr-cell">katabat</td></tr>
      <tr><td>мы написали</td><td class="ar-cell">كَتَبْنَا</td><td class="tr-cell">katabnā</td></tr></tbody></table></div>` },
    { lv:"B1", t:"Настояще-будущее время (аль-мудари)", body:`
      <p>Образуется приставками и окончаниями от того же корня. От <span class="ar">كَتَبَ</span> → <span class="ar">يَكْتُبُ</span> «он пишет».</p>
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Лицо</th><th>Форма</th><th>Транскр.</th></tr></thead><tbody>
      <tr><td>я пишу</td><td class="ar-cell">أَكْتُبُ</td><td class="tr-cell">aktubu</td></tr>
      <tr><td>ты пишешь</td><td class="ar-cell">تَكْتُبُ</td><td class="tr-cell">taktubu</td></tr>
      <tr><td>он пишет</td><td class="ar-cell">يَكْتُبُ</td><td class="tr-cell">yaktubu</td></tr>
      <tr><td>мы пишем</td><td class="ar-cell">نَكْتُبُ</td><td class="tr-cell">naktubu</td></tr></tbody></table></div>` },
    { lv:"B1", t:"Будущее время (سَـ / سَوْفَ)", body:`
      <p>Будущее образуется приставкой <span class="ar">سَـ</span> или словом <span class="ar">سَوْفَ</span> перед глаголом настоящего времени.</p>
      <div class="rule-box"><p><span class="ar" style="font-size:22px">سَيَكْتُبُ</span> — <span class="tr-cell">sa-yaktubu</span> — «он напишет».<br><span class="ar" style="font-size:22px">سَوْفَ أَذْهَبُ</span> — <span class="tr-cell">sawfa adhhabu</span> — «я пойду».</p></div>` },
    { lv:"B1", t:"Повелительное наклонение (аль-амр)", body:`
      <p>Приказ/просьба образуется от глагола настоящего времени.</p>
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Команда</th><th>Форма</th><th>Транскр.</th></tr></thead><tbody>
      <tr><td>пиши!</td><td class="ar-cell">اُكْتُبْ</td><td class="tr-cell">uktub</td></tr>
      <tr><td>читай!</td><td class="ar-cell">اِقْرَأْ</td><td class="tr-cell">iqraʾ</td></tr>
      <tr><td>слушай!</td><td class="ar-cell">اِسْمَعْ</td><td class="tr-cell">ismaʿ</td></tr></tbody></table></div>` },
    { lv:"B1", t:"Отрицание глагола", body:`
      <p>Отрицание зависит от времени:</p>
      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Тип</th><th>Пример</th><th>Значение</th></tr></thead><tbody>
      <tr><td class="ar-cell">لَا</td><td class="ar-cell">لَا يَكْتُبُ</td><td>не пишет (наст.)</td></tr>
      <tr><td class="ar-cell">لَنْ</td><td class="ar-cell">لَنْ يَكْتُبَ</td><td>не напишет (буд.)</td></tr>

    { lv:"B1", t:"Трёхбуквенный корень", body:`
      <p>Основа словообразования — <b>корень</b> из трёх согласных, несущий общий смысл. От <span class="ar">ك ت ب</span> (идея письма):</p>
      <div class="rule-box"><p><span class="ar">كَتَبَ</span> писать · <span class="ar">كِتَاب</span> книга · <span class="ar">كَاتِب</span> писатель · <span class="ar">مَكْتَب</span> офис · <span class="ar">مَكْتَبَة</span> библиотека · <span class="ar">مَكْتُوب</span> написанный.</p></div>` },
    { lv:"B2", t:"Падежи (аль-и'раб)", body:`

      <div class="tbl-wrap"><table class="ex-table"><thead><tr><th>Падеж</th><th>Оконч.</th><th>Пример</th></tr></thead><tbody>

      <tr><td>винительный (насб)</td><td>-a / -an</td><td class="ar-cell">الْبَيْتَ</td></tr>
      <tr><td>родительный (джарр)</td><td>-i / -in</td><td class="ar-cell">الْبَيْتِ</td></tr></tbody></table></div>
      <p class="muted">Определённое имя берёт краткое окончание (-u), неопределённое — танвин (-un).</p>` },
    { lv:"B2", t:"Породы глагола (I–X)", body:`
      <p>От одного корня образуются до десяти <b>пород</b>, меняющих оттенок значения (усиление, каузатив, взаимность, возвратность).</p>

      <tr><td>II</td><td class="ar-cell">عَلَّمَ</td><td>обучать (каузатив)</td></tr>
      <tr><td>V</td><td class="ar-cell">تَعَلَّمَ</td><td>учиться (возвратность)</td></tr>
      <tr><td>X</td><td class="ar-cell">اسْتَعْلَمَ</td><td>справляться, узнавать</td></tr></tbody></table></div>` },
    { lv:"B2", t:"Страдательный залог", body:`

    { lv:"B2", t:"Сравнительная степень (аф'аль)", body:`

      <button class="star ${on?'on':''}" data-fav="${w.ar}" aria-label="В избранное">${starSvg(on)}</button>

      <div class="content">${g.body}</div>

  function viewAlphabet(){
    const letterCards = letters.map((L)=>{
      const init = L.con ? L.ar+ZWJ : L.ar;
      const med  = L.con ? ZWJ+L.ar+ZWJ : ZWJ+L.ar;
      const fin  = ZWJ+L.ar;
      return `<div class="letter" tabindex="0" role="button" aria-label="${L.name}, ${L.hint}">
        <div class="glyph">${L.ar}</div>
        <div class="lname">${L.name}</div>
        <div class="ltr">${L.tr}</div>
        <div class="hint2">${L.hint}</div>

          <div class="form-cell"><div class="fg">${L.ar}</div><div class="fl">изол.</div></div>

    </div>`;

  let dictState = { q:"", cat:"all", pos:"all" };
  function viewDictionary(){
    const cats = ["all", ...Array.from(new Set(vocab.map(v=>v.cat)))];
    return `
    <div class="page-head"><span class="eyebrow">Раздел 02</span><h2>Словарь</h2>

    <div class="search-wrap">

    </div>
    <div class="chips" id="posChips">
      ${["all","глагол","имя","прилагательное","число","вопрос"].map(p=>`<button class="chip ${dictState.pos===p?'active':''}" data-pos="${p}">${p==="all"?"Все части речи":p[0].toUpperCase()+p.slice(1)}</button>`).join("")}

    </div>
    <div class="chips" id="catChips">
      ${cats.map(c=>`<button class="chip ${dictState.cat===c?'active':''}" data-cat="${c}">${c==="all"?"Все категории":c}</button>`).join("")}
    </div>
    <div class="vocab-grid" id="vocabGrid"></div>`;
  }
  function renderVocab(){
    const grid = $("#vocabGrid"); if(!grid) return;
    const q = dictState.q.trim().toLowerCase();
    let list = vocab.filter(w=>{
      if(dictState.cat==="__fav"){ if(!favs.has(w.ar)) return false; }
      else if(dictState.cat!=="all" && w.cat!==dictState.cat) return false;
      if(dictState.pos!=="all" && w.pos!==dictState.pos) return false;
      if(q){ if(!(w.ar+" "+w.tr+" "+w.ru).toLowerCase().includes(q)) return false; }
      return true;
    });
    if(!list.length){ grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ar">لا شيء</div><p>Ничего не найдено. Измените запрос или фильтры.</p></div>`; return; }
    grid.innerHTML = list.map(vcardHTML).join("");
  }

    const L = levels.find(x=>x.id===id) || levels[0];
    const lessons = grammar.filter(g=>g.lv===L.lv);
    const reads = readings.filter(r=>r.lv===L.lv);
    const ex = levelExamples[L.id] || [];

      a1: ["مِنْ","فِي","اللّٰه","أَب","أُمّ","وَاحِد","اثْنَان","بَيْت"],

      b2: ["عِلْم","حَقّ","إِنْسَان","خَلَقَ","جَعَلَ","نُور","قَلْب","حَقّ"]

    <button class="backlink" data-goto="levels"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg> Все уровни</button>

    </div>

    <div class="sec-title"><h3>Уроки грамматики</h3><div class="rule"></div></div>

    <div class="sec-title"><h3>Ключевые слова уровня</h3><div class="rule"></div></div>

  let exMode = "flash";
  function viewExercises(){
    return `
    <div class="page-head"><span class="eyebrow">Раздел 07</span><h2>Задания</h2>
      <p>Закрепите изученное: переворачивайте флешкарты и проверяйте себя в тесте на перевод.</p></div>
    <div class="ex-switch">
      <button class="${exMode==='flash'?'active':''}" data-ex="flash">Флешкарты</button>

    </div>
    <div id="exBody"></div>`;

  let fcIndex = 0, fcFlipped = false, fcDeck = [];
  function renderFlash(){
    const body = $("#exBody"); if(!body) return;
    if(!fcDeck.length){ fcDeck = shuffle(vocab.slice()); fcIndex = 0; }
    const w = fcDeck[fcIndex];
    body.innerHTML = `
    <div class="flashcard-stage">
      <button class="flashcard ${fcFlipped?'flipped':''}" id="flashcard" aria-label="Перевернуть карточку">
        <div class="fc-inner">
          <div class="fc-face fc-front"><div class="ar">${w.ar}</div><div class="hint">нажмите, чтобы перевернуть</div></div>
          <div class="fc-face fc-back"><div class="translit">${w.tr}</div><div class="mean">${w.ru}</div><div class="cat">${w.pos} · ${w.cat}</div></div>
        </div>
      </button>
      <div class="fc-controls">
        <button class="btn btn-outline" id="fcPrev">← Назад</button>
        <span class="fc-count tab-num">${fcIndex+1} / ${fcDeck.length}</span>
        <button class="btn btn-solid" id="fcNext">Далее →</button>
      </div>
      <button class="btn btn-outline" id="fcShuffle">⟳ Перемешать колоду</button>
    </div>`;
    $("#flashcard").addEventListener("click", ()=>{ fcFlipped=!fcFlipped; $("#flashcard").classList.toggle("flipped"); });
    $("#fcPrev").addEventListener("click", ()=>{ fcIndex=(fcIndex-1+fcDeck.length)%fcDeck.length; fcFlipped=false; renderFlash(); });
    $("#fcNext").addEventListener("click", ()=>{ fcIndex=(fcIndex+1)%fcDeck.length; fcFlipped=false; renderFlash(); });
    $("#fcShuffle").addEventListener("click", ()=>{ fcDeck=shuffle(vocab.slice()); fcIndex=0; fcFlipped=false; renderFlash(); });
  }

  let quiz = null;
  function newQuiz(){ const pool = shuffle(vocab.slice()); quiz = { qs: pool.slice(0, 10), i:0, score:0, answered:false }; }
  function renderQuiz(){
    const body = $("#exBody"); if(!body) return;
    if(!quiz) newQuiz();
    if(quiz.i >= quiz.qs.length){
      const pct = Math.round(quiz.score/quiz.qs.length*100);
      const best = store.get("quizBest", 0); if(pct>best) store.set("quizBest", pct);
      body.innerHTML = `<div class="quiz-card card" style="text-align:center">
        <div class="ar" style="font-size:56px;color:var(--gold)">${pct>=80?"مُمْتَاز":pct>=50?"جَيِّد":"وَاصِلْ"}</div>
        <h3 style="font-size:26px;margin:10px 0">Результат: ${quiz.score} из ${quiz.qs.length} (${pct}%)</h3>
        <p class="muted" style="margin-bottom:18px">${pct>=80?"Отлично! ممتاز — превосходно.":pct>=50?"Хорошо! جيّد — продолжайте.":"Не сдавайтесь — واصِل — продолжайте учиться."}</p>
        <button class="btn btn-solid" id="quizAgain">Пройти заново</button>
      </div>`;
      $("#quizAgain").addEventListener("click", ()=>{ newQuiz(); renderQuiz(); });
      return;
    }
    const q = quiz.qs[quiz.i];
    const wrong = shuffle(vocab.filter(v=>v.ru!==q.ru)).slice(0,3);
    const opts = shuffle([q, ...wrong]);
    body.innerHTML = `<div class="quiz-card card">
      <div class="quiz-q"><div class="prompt">Выберите перевод слова:</div><div class="ar">${q.ar}</div><div class="translit">${q.tr}</div></div>
      <div class="quiz-opts" id="quizOpts">${opts.map(o=>`<button class="opt" data-ru="${o.ru}">${o.ru}</button>`).join("")}</div>
      <div class="quiz-foot"><span class="quiz-score tab-num">Вопрос ${quiz.i+1}/${quiz.qs.length} · очки: ${quiz.score}</span>
        <button class="btn btn-outline" id="quizNext" style="visibility:hidden">Далее →</button></div>
    </div>`;
    $$("#quizOpts .opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(quiz.answered) return; quiz.answered = true;
        const chosen = btn.dataset.ru;
        $$("#quizOpts .opt").forEach(b=>{ b.disabled = true; if(b.dataset.ru===q.ru) b.classList.add("correct"); else if(b.dataset.ru===chosen) b.classList.add("wrong"); });
        if(chosen===q.ru) quiz.score++;
        const nx = $("#quizNext"); nx.style.visibility="visible"; nx.focus();
      });
    });
    $("#quizNext").addEventListener("click", ()=>{ quiz.i++; quiz.answered=false; renderQuiz(); });
  }
  function renderExBody(){ if(exMode==="flash") renderFlash(); else renderQuiz(); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  /* ================= ROUTER ================= */
  let activeLevel = "a1";
  const views = { home:viewHome, alphabet:viewAlphabet, dictionary:viewDictionary, phrasebook:viewPhrasebook, grammar:viewGrammar, reading:viewReading, exercises:viewExercises, levels:viewLevels, levelDetail:()=>viewLevelDetail(activeLevel) };

  function go(name){
    if(!views[name]) name = "home";
    main.innerHTML = views[name]();
    window.scrollTo({top:0,behavior:"instant"});
    const navName = name==="levelDetail" ? "levels" : name;
    $$(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.view===navName));
    if(name!=="levelDetail") store.set("lastView", name);
    if(name==="dictionary"){ renderVocab(); wireDict(); }
    if(name==="exercises"){ renderExBody(); wireEx(); }
    closeMenu();
  }
  function wireDict(){
    const s = $("#dictSearch");
    if(s){ s.addEventListener("input", e=>{ dictState.q = e.target.value; renderVocab(); }); }
    $$("#posChips .chip").forEach(c=>c.addEventListener("click", ()=>{
      if(c.dataset.cat==="__fav"){ dictState.cat = dictState.cat==="__fav"?"all":"__fav"; }
      else { dictState.pos = c.dataset.pos; }
      go("dictionary");
    }));
    $$("#catChips .chip").forEach(c=>c.addEventListener("click", ()=>{ dictState.cat = c.dataset.cat; go("dictionary"); }));
  }
  function wireEx(){ $$(".ex-switch button").forEach(b=>b.addEventListener("click", ()=>{ exMode = b.dataset.ex; go("exercises"); })); }

  document.addEventListener("click", e=>{
    const lvl = e.target.closest("[data-level]");
    if(lvl){ activeLevel = lvl.dataset.level; go("levelDetail"); return; }
    const goto = e.target.closest("[data-goto]");
    if(goto){ go(goto.dataset.goto); return; }
    const fav = e.target.closest("[data-fav]");
    if(fav){
      const key = fav.dataset.fav;
      if(favs.has(key)) favs.delete(key); else favs.add(key);
      saveFavs(); fav.classList.toggle("on", favs.has(key)); fav.innerHTML = starSvg(favs.has(key)); return;
    }
  });

  $$(".nav-item").forEach(n=>n.addEventListener("click", ()=>go(n.dataset.view)));

  const shell = $("#shell");
  function openMenu(){ shell.classList.add("open"); }
  function closeMenu(){ shell.classList.remove("open"); }
  $("#menuBtn").addEventListener("click", openMenu);
  $("#backdrop").addEventListener("click", closeMenu);

  const themeBtn = $("#themeBtn");
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t); store.set("theme", t);
    themeBtn.innerHTML = t==="dark"
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
  }
  const savedTheme = store.get("theme", null);
  applyTheme(savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  themeBtn.addEventListener("click", ()=>{ const cur = document.documentElement.getAttribute("data-theme"); applyTheme(cur==="dark"?"light":"dark"); });

  document.addEventListener("keydown", e=>{
    if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("letter")){ e.preventDefault(); e.target.classList.toggle("flipped"); }
  });

  go(store.get("lastView","home"));
})();
</script>

</body>
</html>
